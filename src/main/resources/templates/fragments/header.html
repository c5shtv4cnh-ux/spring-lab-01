<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/books}">Catalogue</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administration</a>

    <span class="who" sec:authorize="isAuthenticated()">
        Logged in as <b sec:authentication="name">anonymous</b>,
        roles <code sec:authentication="principal.authorities">[ROLE_USER]</code>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit">Log out</button>
        </form>
    </span>
    <span class="who" sec:authorize="isAnonymous()">
        Not logged in · <a th:href="@{/login}">Log in</a>
    </span>
</header>
</body>
</html>
