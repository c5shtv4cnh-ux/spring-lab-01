# Lab 13, task 4 — load-test profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=perf
# Variant 3: delay 400 ms, Tomcat pool 25, concurrency 200. Little's law ceiling: 25 / 0.4 s = 62.5 req/s.
server.tomcat.threads.max=25
# /api/slow exists (SlowController is @Profile("perf")) and is permitted only in this profile
lab13.permit-slow=true
# no SQL or per-request noise while measuring
logging.level.org.hibernate.SQL=info
# platform threads in this profile; the virtual-thread run adds the "vt" profile (perf,vt)
spring.threads.virtual.enabled=false
