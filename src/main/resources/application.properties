spring.application.name=spring-lab-01

# PostgreSQL 16 (Homebrew), database txlab; local teaching setup only
spring.datasource.url=jdbc:postgresql://localhost:5432/txlab
spring.datasource.username=askarhan
spring.datasource.password=

# Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# make transaction boundaries visible in the log
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
