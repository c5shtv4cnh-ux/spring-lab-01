spring.application.name=spring-lab-01

# PostgreSQL 16 (Homebrew), database springlab; local teaching setup only
spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=askarhan
spring.datasource.password=

# Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Lab 13 ----------
# Task 1: Spring Cache with Caffeine (variant 3: AuthorService.byId, cache "authors")
spring.cache.cache-names=authors
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats
# SQL in the log: proves that a cache hit issues no SELECT
logging.level.org.hibernate.SQL=debug
# /actuator/caches shows the cache from outside the application, /actuator/metrics/cache.gets its hits and misses
# (ADMIN only, see SecurityConfiguration)
management.endpoints.web.exposure.include=health,caches,metrics

# Task 2: the @Async executor — sized and named
spring.task.execution.thread-name-prefix=async-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50

# Task 3: the scheduler's threads; the job's cron (02:00) and zone (Asia/Almaty) are in OverdueMarkingJob
spring.task.scheduling.thread-name-prefix=sched-
